name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + API regression)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry (pinned)
        run: pip install poetry==2.3.3
      - name: Cache Poetry cache dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run tests
        run: >-
          poetry run pytest tests
          ../plugins/zhihu_digest/tests
          ../plugins/desktop_checkin/tests
          -q
      - name: API regression (flows + endpoints)
        run: |
          poetry run uvicorn app.main:app --host 127.0.0.1 --port 3001 &
          UVICORN_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health > /dev/null && break
            sleep 0.5
          done
          bash ../tools/test/feature-checks/run-checks.sh http://127.0.0.1:3001
          kill $UVICORN_PID
          wait $UVICORN_PID 2>/dev/null || true

  frontend:
    name: Frontend (vue-tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check + build (web)
        run: npm run build:web

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Validate compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: autoflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files
