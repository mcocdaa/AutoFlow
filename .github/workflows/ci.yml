name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + API regression)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: >-
          uv run pytest tests
          ../plugins/zhihu_digest/tests
          ../plugins/desktop_checkin/tests
          -q
      - name: API regression (flows + endpoints)
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 3001 &
          UVICORN_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health > /dev/null && break
            sleep 0.5
          done
          bash ../tools/test/feature-checks/run-checks.sh http://127.0.0.1:3001
          kill $UVICORN_PID
          wait $UVICORN_PID 2>/dev/null || true

  frontend:
    name: Frontend (vue-tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check + build (web)
        run: npm run build:web

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Validate compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: autoflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files
