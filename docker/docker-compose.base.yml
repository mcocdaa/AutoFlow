# ============================================
# AutoFlow Docker Compose 基础模板 (服务定义层)
# 不可单独使用,需与 backend/frontend 端口映射层合并
# ============================================

networks:
  autoflow-network:
    driver: bridge

services:
  autoflow-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_VERSION=v1
      - PYTHONPATH=/app/backend
    volumes:
      - ../plugins:/app/plugins:ro
    networks:
      - autoflow-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
