name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry (pinned)
        run: pip install poetry==2.3.3
      - name: Cache Poetry cache dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Lint (ruff)
        run: poetry run ruff check app tests ../plugins
      - name: Format check (ruff)
        run: poetry run ruff format --check app tests ../plugins
      - name: Run tests
        run: >-
          poetry run pytest tests
          ../plugins/zhihu_digest/tests
          ../plugins/desktop_checkin/tests
          -q

  smoke:
    name: Smoke test (startup + endpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry (pinned)
        run: pip install poetry==2.3.3
      - name: Cache Poetry cache dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Start server and smoke test
        run: |
          poetry run uvicorn app.main:app --host 127.0.0.1 --port 13999 &
          UVICORN_PID=$!
          # Wait for server to be ready (max 15 seconds)
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:13999/health > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          # Health check
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:13999/health)
          echo "Health: HTTP $HEALTH_CODE"
          [ "$HEALTH_CODE" = "200" ] || { echo "FAIL: health check"; kill $UVICORN_PID; exit 1; }
          # Plugins check
          PLUGINS_BODY=$(curl -s http://127.0.0.1:13999/api/v1/plugins)
          echo "$PLUGINS_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'actions' in d, 'missing actions key'" || {
            echo "FAIL: plugins response missing actions key"
            kill $UVICORN_PID
            exit 1
          }
          echo "Smoke test passed"
          kill $UVICORN_PID
          wait $UVICORN_PID 2>/dev/null || true

  frontend:
    name: Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit
      - name: Build (vite)
        run: npx vite build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

  docker-compose:
    name: Docker compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Validate root compose
        run: docker compose config --quiet
      - name: Validate full compose
        run: docker compose -f docker/docker-compose.full.yml config --quiet
      - name: Validate layered dev compose
        run: docker compose -f docker/docker-compose.base.yml -f docker/docker-compose.backend.yml -f docker/docker-compose.frontend.yml config --quiet

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files
