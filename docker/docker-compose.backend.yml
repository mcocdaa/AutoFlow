# ============================================
# AutoFlow 后端端口映射层
# 不可单独使用,需与 base 服务定义层合并
# 用法: docker compose -f docker-compose.base.yml -f docker-compose.backend.yml up
# ============================================

services:
  autoflow-backend:
    ports:
      - "${BACKEND_EXTERNAL_PORT:-3001}:3000"

networks:
  autoflow-network:
    external: false
