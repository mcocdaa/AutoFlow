# @file /docs/examples/engine/05_retry.flow.yaml
# @brief 失败重试：第一次失败，第二次成功（依赖标记文件模拟不稳定命令）
# @create 2026-09-10
# @update 2026-09-11 标记目录改为 vars.marker_dir,支持容器等不同运行环境

version: "1.0"
name: feature-retry

steps:
  - id: flaky
    name: 不稳定命令（首次失败后重试成功）
    action:
      type: openclaw.exec
      params:
        safe_mode: false
        command: "if [ -f {{vars.marker_dir}}/autoflow_retry_marker ]; then echo recovered; exit 0; else touch {{vars.marker_dir}}/autoflow_retry_marker; echo first-attempt-failed; exit 1; fi"
    check:
      type: openclaw.exit_code_zero
    retry:
      attempts: 2
      backoff_seconds: 0.1
