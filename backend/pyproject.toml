[tool.poetry]
name = "autoflow-backend"
version = "0.1.0"
description = "AutoFlow Backend API and Execution Engine"
authors = ["AutoFlow Team <team@autoflow.dev>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = ">=0.100.0"
uvicorn = ">=0.23.0"
pydantic = ">=2.0.0"
python-dotenv = ">=1.0.0"
pyyaml = ">=6.0.0"
httpx = ">=0.24.0"
pyautogui = ">=0.9.54"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
ruff = ">=0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "../plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
