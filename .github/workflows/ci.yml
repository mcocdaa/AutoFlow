name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poetry (pinned)
        run: pip install poetry==2.3.3
      - name: Cache Poetry cache dir
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --with dev
      - name: Lint (ruff)
        run: poetry run ruff check app tests ../plugins
      - name: Format check (ruff)
        run: poetry run ruff format --check app tests ../plugins
      - name: Run tests
        run: >-
          poetry run pytest tests
          ../plugins/zhihu_digest/tests
          ../plugins/desktop_checkin/tests
          -q

  frontend:
    name: Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit
      - name: Build (vite)
        run: npx vite build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

  docker-compose:
    name: Docker compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Validate root compose
        run: docker compose config --quiet
      - name: Validate full compose
        run: docker compose -f docker/docker-compose.full.yml config --quiet
      - name: Validate layered dev compose
        run: docker compose -f docker/docker-compose.base.yml -f docker/docker-compose.backend.yml -f docker/docker-compose.frontend.yml config --quiet

  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files
