version: 2
updates:
  # npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # vue-tsc 3.x 跟随 TypeScript 5.x API;TS 7(native) 待工具链支持后手动升级
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  # pip
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
  # github-actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
  # Docker 基础镜像（backend + devcontainer）
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: mcr.microsoft.com/devcontainers/python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: devcontainers/python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /.devcontainer
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
  # gitsubmodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(submodule)'
