# ============================================
# AutoFlow 全栈模式 (后端 + 前端 + MySQL + Redis)
# 用法: docker compose -f docker/docker-compose.full.yml -p autoflow up -d --build
# 分层: base(服务定义) + backend(端口映射) + frontend(前端服务)
# ============================================

include:
  - docker-compose.base.yml
  - docker-compose.backend.yml
  - docker-compose.frontend.yml
