# ============================================
# AutoFlow 全栈模式 (后端 + 前端) - 自包含
# 用法: docker compose -f docker/docker-compose.full.yml -p autoflow up -d --build
#
# 注意: 本文件为自包含定义(每个 service 只定义一次),
# 根目录 docker-compose.yml 通过 include 本文件。
# 分层文件(base/backend/frontend)仅供 scripts/start.sh 以 -f 方式叠加使用。
# ============================================

networks:
  autoflow-network:
    driver: bridge

services:
  autoflow-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_EXTERNAL_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_VERSION=v1
      - PYTHONPATH=/app/backend
    volumes:
      - ../plugins:/app/plugins:ro
    networks:
      - autoflow-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  autoflow-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8001}:8000"
    environment:
      - VITE_API_PROXY_URL=http://autoflow-backend:3000
      - DOCKER_WEB=true
    networks:
      - autoflow-network
    depends_on:
      - autoflow-backend
