# ============================================
# AutoFlow 前端服务层
# 不可单独使用,需与 base 服务定义层合并
# 用法: docker compose -f docker-compose.base.yml -f docker-compose.frontend.yml up
# ============================================

services:
  autoflow-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: web
      args:
        - BUILD_ENV=${FRONTEND_BUILD_ENV:-dev}
    restart: unless-stopped
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8001}:8000"
    environment:
      - VITE_API_PROXY_URL=http://autoflow-backend:3000
      - DOCKER_WEB=true
    networks:
      - autoflow-network
    depends_on:
      - autoflow-backend

networks:
  autoflow-network:
    name: autoflow-network
